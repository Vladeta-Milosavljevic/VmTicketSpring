spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/vmticket;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    locations: classpath:db/migration,classpath:db/seed

app:
  security:
    enabled: true
    expose-h2-console: true
  auth:
    token-ttl: PT8H
  storage:
    location: ./data/uploads
    max-file-bytes: 10485760
